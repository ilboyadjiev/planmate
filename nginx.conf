# Link-preview crawlers (they read the page's Open Graph tags and run no JavaScript). Facebook, Messenger and
# Instagram send facebookexternalhit/Facebot/meta-externalagent; iMessage pretends to be facebookexternalhit too.
map $http_user_agent $link_preview_bot {
    default 0;
    "~*(facebookexternalhit|facebot|meta-externalagent|meta-externalfetcher|whatsapp|instagram|twitterbot|linkedinbot|slackbot|discordbot|telegrambot|skypeuripreview|pinterest|redditbot|embedly|vkshare|viber|snapchat|mastodon|bluesky)" 1;
}

# The event id in /events/{id}
map $uri $preview_event_id {
    default "";
    "~^/events/(?<id>[A-Za-z0-9_-]{1,64})/?$" $id;
}

# Crawler asking for an event page
map "$link_preview_bot:$preview_event_id" $event_preview {
    default 0;
    "~^1:." 1;
}

server {
    listen 80;
    server_name planmate.org www.planmate.org;
    return 301 https://www.planmate.org$request_uri;
}

server {
    listen 443 ssl;
    server_name planmate.org;

    ssl_certificate /etc/letsencrypt/live/planmate.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/planmate.org/privkey.pem;

    return 301 https://www.planmate.org$request_uri;
}

server {
    listen 443 ssl;
    server_name www.planmate.org;

    ssl_certificate /etc/letsencrypt/live/planmate.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/planmate.org/privkey.pem;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Shared event links: people get the app; link-preview crawlers get the event's title, date, place and
    # picture from the backend (EventPreviewService), since they cannot run the app.
    location /events/ {
        root /usr/share/nginx/html;
        error_page 418 = @event_preview;
        if ($event_preview) {
            return 418;
        }
        try_files $uri /index.html;
    }

    location @event_preview {
        rewrite ^ /api/v2/events/$preview_event_id/preview break;
        proxy_pass http://planmate-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://planmate-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
