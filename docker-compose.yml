version: '3.8'

services:
  postgres:
    image: 'postgres:14-alpine'
    restart: always
    environment:
      - 'POSTGRES_DB=${DB_NAME}'
      - 'POSTGRES_USER=${DB_USER}'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD}'
    networks:
      - planmate-network
    volumes:
      - planmate-volume:/var/lib/postgresql/data

  mongodb:
      image: 'mongo:6'
      restart: always
      ports:
        - "27017:27017"
      environment:
        - 'MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}'
        - 'MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}'
        - 'MONGO_INITDB_DATABASE=planmate_nosql'
      networks:
        - planmate-network
      volumes:
        - planmate-mongo-volume:/data/db

  backend:
    image: 'iliandocker/planmate-docker-repo:planmate-backend'
    container_name: planmate-backend
    restart: always
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${DB_NAME}'
      - 'SPRING_DATASOURCE_USERNAME=${DB_USER}'
      - 'SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}'
      - 'SPRING_PROFILES_ACTIVE=docker' 
      - 'JWT_SECRET=${JWT_SECRET}'
      - 'GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}'
      - 'SPRING_DATA_MONGODB_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/planmate_nosql?authSource=admin'
      - 'GEMINI_API_KEY=${GEMINI_API_KEY}'
      - 'LOCATIONIQ_API_KEY=${LOCATIONIQ_API_KEY}'
    networks:
      - planmate-network
    depends_on:
      - postgres
      - mongodb

  frontend:
    image: 'iliandocker/planmate-docker-repo:planmate-frontend'
    container_name: planmate-frontend
    restart: always
    ports:
      - "80:80" 
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - planmate-network
    depends_on:
      - backend

volumes:
  planmate-volume:
    driver: local
  planmate-mongo-volume:
    driver: local

networks:
  planmate-network:
    name: planmate-network
    driver: bridge