spring.application.name=planmate
# Use an env var to toggle profiles (local, docker, prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.servlet.context-path=/

# Hibernate & Database Config
spring.datasource.driver-class-name=org.postgresql.Driver

# This will automatically switch between 'postgres' (for docker) or 'localhost' (for local dev)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://${MONGO_USER}:${MONGO_PASSWORD}@localhost:27017/planmate_nosql?authSource=admin}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Uploads: profile pictures only (the app sends ~5-10 KB; AvatarService accepts up to 512 KB)
spring.servlet.multipart.max-file-size=512KB
spring.servlet.multipart.max-request-size=600KB

# Spring Security & JWT
application.security.disabled=${SECURITY_DISABLED:false}
# NEVER hardcode the real secret here. 
# In production, this must be a long random string provided via Environment Variables.
jwt.secret=${JWT_SECRET}
google.client.id=${GOOGLE_CLIENT_ID:missing_google_client_id}
gemini.api.key=${GEMINI_API_KEY:missing_gemini_api_key}
gemini.api.model=${GEMINI_MODEL:gemini-3.5-flash}
# LocationIQ
locationiq.api.key=${LOCATIONIQ_API_KEY:missing_locationiq_api_key}

# Commit SHA of the running build, reported by /api/health
app.version=${APP_VERSION:unknown}
# Public address of the app, for links in exported calendar events
app.public-url=${APP_PUBLIC_URL:https://www.planmate.org}