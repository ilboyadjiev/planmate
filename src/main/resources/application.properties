spring.application.name=planmate
# Use an env var to toggle profiles (local, docker, prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.servlet.context-path=/

# Hibernate & Database Config
spring.datasource.driver-class-name=org.postgresql.Driver

# This will automatically switch between 'postgres' (for docker) or 'localhost' (for local dev)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://${MONGO_USER}:${MONGO_PASSWORD}@localhost:27017/planmate_nosql?authSource=admin}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Uploads: profile pictures only (the app sends ~5-10 KB; AvatarService accepts up to 512 KB)
spring.servlet.multipart.max-file-size=512KB
spring.servlet.multipart.max-request-size=600KB

# Spring Security & JWT
application.security.disabled=${SECURITY_DISABLED:false}
# NEVER hardcode the real secret here. 
# In production, this must be a long random string provided via Environment Variables.
jwt.secret=${JWT_SECRET}
google.client.id=${GOOGLE_CLIENT_ID:missing_google_client_id}
gemini.api.key=${GEMINI_API_KEY:missing_gemini_api_key}
gemini.api.model=${GEMINI_MODEL:gemini-3.5-flash}
# LocationIQ
locationiq.api.key=${LOCATIONIQ_API_KEY:missing_locationiq_api_key}

# Commit SHA of the running build, reported by /api/health
app.version=${APP_VERSION:unknown}
# Public address of the app, for links in exported calendar events
app.public-url=${APP_PUBLIC_URL:https://www.planmate.org}
# Origins allowed to call the API from a browser (CORS). Comma-separated; no wildcard, since credentials are allowed.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://www.planmate.org,https://planmate.org,http://localhost:3000}
# Events from the discovery service (Redpanda). Off unless DISCOVERY_CONSUMER_ENABLED=true.
discovery.consumer.enabled=${DISCOVERY_CONSUMER_ENABLED:false}
discovery.consumer.group=planmate-backend
discovery.topics.events=discovery.events
discovery.topics.dead-letter=discovery.events.dlq
discovery.events-creator=events@planmate.org
# Nightly cleanup of long-past imported events (creator discovery.events-creator) that nobody joined. The events
# collection otherwise grows without bound as new public events are imported daily; Discover and search already hide
# events that have ended. Events anyone joined or answered Maybe to are kept (they are someone's calendar history).
discovery.cleanup.enabled=${DISCOVERY_CLEANUP_ENABLED:true}
discovery.cleanup.retention-days=${DISCOVERY_CLEANUP_RETENTION_DAYS:30}
discovery.cleanup.cron=${DISCOVERY_CLEANUP_CRON:0 30 4 * * *}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
